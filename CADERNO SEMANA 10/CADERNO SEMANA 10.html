page.active{display:block}.shell{max-width:1180px;margin:auto}.hero{min-height:62vh;display:flex;flex-direction:column;justify-content:center}.k{margin-bottom:6px}h2{font-size:40px;line-height:1.07;letter-spacing:-.035em;margin:8px 0 14px}h3{font-size:20px;margin:0 0 8px}.lead{font-size:18px;line-height:1.52;color:#f1ddd2}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card,.step,.field,.check,.evidence{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(56,22,8,.84),rgba(22,8,2,.9));padding:15px}.card.green{border-color:rgba(74,222,128,.35)}.card.red{border-color:rgba(251,113,133,.35)}.card.amber{border-color:rgba(251,191,36,.35)}.card.cyan{border-color:rgba(103,232,249,.35)}.card p{color:#ead2c6;line-height:1.48}.call{border:1px solid rgba(251,146,60,.3);background:rgba(251,146,60,.08);border-radius:14px;padding:12px 14px;margin:12px 0;line-height:1.5}.call.green{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.07)}.call.amber{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.07)}.call.red{border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.07)}.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}.flow span{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.06);font-weight:850}.flow b{color:var(--orange);font-size:20px}.step{display:grid;grid-template-columns:34px 1fr;gap:10px;margin:12px 0}.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(251,146,60,.12);border:1px solid rgba(251,146,60,.3);color:var(--orange);font-weight:950}.cw{position:relative;margin:10px 0}.copy{position:absolute;right:8px;top:7px;border:1px solid var(--line);background:#301306;color:white;border-radius:8px;padding:5px 8px;font-size:11px;font-weight:900;cursor:pointer}pre{white-space:pre-wrap;background:var(--code);border:1px solid rgba(251,146,60,.25);border-radius:14px;padding:14px 16px;color:#ffedd5;font:12.5px/1.48 Consolas,monospace;overflow:auto}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:8px}.field textarea{width:100%;resize:vertical;field-sizing:content;border:1px solid var(--line);background:rgba(0,0,0,.24);color:var(--text);border-radius:12px;padding:11px;line-height:1.4}.check{margin:10px 0;cursor:pointer}.check.done{border-color:rgba(74,222,128,.48);background:rgba(74,222,128,.08)}.evidence{margin:13px 0;border-color:rgba(103,232,249,.3)}.evhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.evhelp{font-size:12px;color:var(--muted);line-height:1.4}.evbtn{display:inline-flex;align-items:center;gap:7px;margin-top:10px;border:1px solid rgba(103,232,249,.35);background:rgba(103,232,249,.08);color:white;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900;cursor:pointer}.evimg{margin-top:11px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#080301}.evimg img{display:block;max-width:100%;max-height:540px;margin:auto;border-radius:8px}.evcap{width:100%;margin-top:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:white;border-radius:9px;padding:8px}.evremove{margin-top:7px;border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.08);color:#ffd8df;border-radius:8px;padding:6px 9px;font-size:11px;cursor:pointer}.bottom{position:fixed;bottom:16px;left:325px;right:25px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.bottom button{pointer-events:auto;border:1px solid var(--line);background:#210c03;color:#fff;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}.counter{font-size:12px;font-weight:900;color:#e6c6b5}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.bottom{left:18px}.page{padding:22px 16px 100px}.g2{grid-template-columns:1fr}h2{font-size:34px}}@media print{body{overflow:visible;background:white!important;color:#111!important}.side,.bottom{display const pages=[{"id": "inicio", "title": "Comece aqui", "blocks": [{"type": "html", "html": "<div class='hero'><div class='k'>Big Data · Semana 10 · laboratório</div><h2>Spark SQL e Otimização</h2><div class='lead'>Após ~50 minutos de teoria, este caderno conduz 150 minutos de prática: medir um baseline, ler o plano, corrigir o pipeline, comparar a execução, testar cache e montar um PDF com evidências.</div><div class='g2'><div class='card cyan'><h3>Entrega principal</h3><p>Um PDF gerado pelo botão <b>Imprimir / Salvar PDF</b>, com respostas e prints inseridos no próprio caderno.</p></div><div class='card green'><h3>Backup</h3><p>Baixe <b>JSON</b> para recuperar tudo (inclusive prints comprimidos) e <b>Markdown</b> para ter uma cópia textual.</p></div></div><div class='call amber'><b>Regra:</b> não escreva apenas “ficou mais rápido”. Mostre o que mudou no <code>explain()</code>, na Spark UI e nos tempos.</div></div>"}, {"type": "field", "id": "nome", "label": "Nome completo", "big": false}, {"type": "field", "id": "turma", "label": "Turma / grupo", "big": false}]}, {"id": "consulta1", "title": "Consulta · Catalyst", "blocks": [{"type": "html", "html": "<div class='k'>Referência rápida</div><h2>O que o Catalyst faz?</h2><div class='flow'><span>DataFrame/SQL</span><b>→</b><span>Analysis</span><b>→</b><span>Logical Optimization</span><b>→</b><span>Physical Plan</span><b>→</b><span>Execução</span></div><div class='call'>Pense assim: você descreve <b>o resultado desejado</b>; Spark tenta escolher <b>como chegar lá</b>.</div><div class='g2'><div class='card'><h3>Otimizações lógicas</h3><p>Predicate pushdown, column pruning, simplificações.</p></div><div class='card'><h3>Planejamento físico</h3><p>Estratégias de join, exchanges, scans.</p></div></div>"}]}, {"id": "consulta2", "title": "Consulta · explain()", "blocks": [{"type": "html", "html": "<div class='k'>Referência rápida</div><h2>Como ler explain() sem se perder</h2><pre>df.explain()\ndf.explain('extended')\ndf.explain('formatted')\ndf.explain('cost')\ndf.explain('codegen')</pre><div class='g2'><div class='card green'><h3>Procure</h3><p>PushedFilters · ReadSchema · BroadcastHashJoin · BroadcastExchange</p></div><div class='card red'><h3>Investigue</h3><p>BatchEvalPython · Exchange · SortMergeJoin quando a dimensão é pequena</p></div></div><div class='call amber'>Na prática, use <b>formatted</b>. O script já imprime o plano; seu trabalho é interpretar os sinais.</div>"}]}, {"id": "consulta3", "title": "Consulta · Cache", "blocks": [{"type": "html", "html": "<div class='k'>Referência rápida</div><h2>Cache só quando há reutilização</h2><div class='g2'><div class='card red'><h3>Sem cache</h3><p>O mesmo trecho caro pode ser recalculado em actions diferentes.</p></div><div class='card green'><h3>Com cache</h3><p><code>cache()</code> marca; uma action materializa; próximas actions podem reutilizar.</p></div></div><div class='call'><b>Spark 4.2:</b> o padrão de <code>DataFrame.cache()</code> é <code>MEMORY_AND_DISK_DESER</code>. Ao terminar, use <code>unpersist()</code>.</div>"}]}, {"id": "setup", "title": "Prática · Ambiente · 0–10 min", "blocks": [{"type": "html", "html": "<div class='k'>Laboratório · 0–10 min</div><h2>1. Abra o projeto no VS Code</h2><div class='call amber'>Extraia o ZIP antes de abrir. Requisitos: Python 3.10+, Java 17+ e PySpark 4.2.0.</div>"}, {"type": "step", "n": 1, "title": "Abra a pasta extraída", "blocks": [{"type": "html", "html": "<p>VS Code → Arquivo → Abrir Pasta → selecione <b>aluno_projeto</b>.</p>"}]}, {"type": "step", "n": 2, "title": "Abra Terminal → Novo Terminal", "blocks": [{"type": "code", "code": "python --version\njava -version\npython -m pip install -r requirements.txt\npython check_env.py"}]}, {"type": "html", "html": "<div class='call green'>Resultado desejado: <b>AMBIENTE OK</b>. Se <code>python</code> não funcionar no Windows, tente <code>py</code>.</div>"}, {"type": "check", "id": "env", "label": "check_env.py terminou com AMBIENTE OK."}]}, {"id": "dados", "title": "Prática · Dados · 10–25 min", "blocks": [{"type": "html", "html": "<div class='k'>Laboratório · 10–25 min</div><h2>2. Gere o dataset local</h2><p>O ZIP é pequeno; Spark cria os Parquets na sua máquina.</p>"}, {"type": "code", "code": "python gerar_dados.py"}, {"type": "html", "html": "<div class='call'>Cria ~1,2 milhão de pedidos e 200 produtos. Plano B para PC fraco: <code>python gerar_dados.py --linhas 300000</code>.</div>"}, {"type": "field", "id": "pastas", "label": "Quais pastas apareceram dentro de data/?", "big": false}, {"type": "check", "id": "dadosok", "label": "data/pedidos e data/produtos foram criadas."}]}, {"id": "baseline", "title": "Baseline · 25–50 min", "blocks": [{"type": "html", "html": "<div class='k'>Laboratório · 25–50 min</div><h2>3. Execute o pipeline ruim antes de corrigir</h2><div class='call red'><b>Não altere pipeline_lento.py.</b> Ele desativa auto-broadcast e AQE de propósito para criar um baseline didático previsível.</div>"}, {"type": "code", "code": "python pipeline_lento.py"}, {"type": "html", "html": "<p>Quando o script pausar, tire o primeiro print do <code>explain()</code>. Depois abra a URL da Spark UI impressa no terminal, pressione ENTER, aguarde o job e tire o segundo print.</p>"}, {"type": "field", "id": "base_join", "label": "No explain baseline: qual estratégia de join apareceu?", "big": false}, {"type": "field", "id": "base_udf", "label": "Você encontrou BatchEvalPython/pythonUDF? O que isso indica?", "big": true}, {"type": "field", "id": "base_push", "label": "PushedFilters/ReadSchema: o que você observou?", "big": true}, {"type": "field", "id": "base_time", "label": "Tempo do baseline (segundos) — veja output/baseline_metricas.json", "big": false}, {"type": "evidence", "id": "ev_base_explain", "label": "Evidência 1 · Print do explain BASELINE", "help": "Capture o terminal mostrando o plano e termos importantes."}, {"type": "evidence", "id": "ev_base_ui", "label": "Evidência 2 · Print da Spark UI BASELINE", "help": "Preferência: aba SQL/Stages com informações de Exchange/shuffle."}, {"type": "check", "id": "baseok", "label": "Registrei plano, tempo e 2 evidências do baseline."}]}, {"id": "todo1", "title": "TODO 1 · 50–70 min", "blocks": [{"type": "html", "html": "<div class='k'>Laboratório · 50–70 min</div><h2>4. Troque a lógica opaca por filtro nativo + column pruning</h2><p>Abra <b>pipeline_desafio.py</b> e encontre <code>preparar_pedidos(df)</code>. Substitua somente <code>return None</code>:</p>"}, {"type": "code", "code": "return (df\n    .filter((F.col(\"status\") == \"paid\") & (F.col(\"total\") > 1000))\n    .select(\"product_id\", \"total\", \"mes\", \"regiao\"))"}, {"type": "code", "code": "python pipeline_desafio.py"}, {"type": "html", "html": "<div class='call green'>Se o TODO 1 estiver correto, o script avança e para no <b>TODO 2</b>.</div>"}, {"type": "field", "id": "todo1q", "label": "Por que essa versão é mais amigável ao Catalyst que filtrar o resultado de uma UDF?", "big": true}, {"type": "check", "id": "todo1ok", "label": "O script chegou ao TODO 2."}]}, {"id": "todo2", "title": "TODO 2 · 70–90 min", "blocks": [{"type": "html", "html": "<div class='k'>Laboratório · 70–90 min</div><h2>5. Faça broadcast apenas da dimensão pequena</h2><p>Na função <code>juntar_produtos</code>, substitua <code>return None</code>:</p>"}, {"type": "code", "code": "return df.join(\n    F.broadcast(dim_produtos.select(\"product_id\", \"product_name\", \"category\")),\n    \"product_id\", \"inner\"\n)"}, {"type": "code", "code": "python pipeline_desafio.py"}, {"type": "html", "html": "<div class='call green'>Se estiver correto, o script avança e para no <b>TODO 3</b>.</div>"}, {"type": "field", "id": "todo2q", "label": "Qual DataFrame é copiado para os executors? Por que ele é o candidato correto?", "big": true}, {"type": "check", "id": "todo2ok", "label": "O script chegou ao TODO 3."}]}, {"id": "todo3", "title": "TODO 3 · 90–105 min", "blocks": [{"type": "html", "html": "<div class='k'>Laboratório · 90–105 min</div><h2>6. Complete a agregação</h2><p>Na função <code>agregar(df)</code>:</p>"}, {"type": "code", "code": "return (df\n    .groupBy(\"product_name\", \"category\")\n    .agg(\n        F.round(F.sum(\"total\"), 2).alias(\"receita\"),\n        F.count(\"*\").alias(\"qtd_pedidos\"),\n        F.round(F.avg(\"total\"), 2).alias(\"ticket_medio\")\n    )\n    .orderBy(F.desc(\"receita\")))"}, {"type": "code", "code": "python pipeline_desafio.py"}, {"type": "html", "html": "<p>Agora o script exibirá o explain otimizado, pausará para a Spark UI e gravará <code>output/otimizado_metricas.json</code>.</p>"}, {"type": "field", "id": "opt_join", "label": "No explain otimizado: quais termos confirmam o broadcast?", "big": false}, {"type": "field", "id": "opt_push", "label": "O que mudou em PushedFilters e ReadSchema?", "big": true}, {"type": "field", "id": "opt_time", "label": "Tempo otimizado (segundos)", "big": false}, {"type": "evidence", "id": "ev_opt_explain", "label": "Evidência 3 · Print do explain OTIMIZADO", "help": "Tente incluir PushedFilters/ReadSchema e BroadcastHashJoin/BroadcastExchange."}, {"type": "evidence", "id": "ev_opt_ui", "label": "Evidência 4 · Print da Spark UI OTIMIZADA", "help": "Capture a execução após a mudança, para comparação."}, {"type": "check", "id": "todo3ok", "label": "output/otimizado e otimizado_metricas.json foram criados."}]}, {"id": "comparar", "title": "Comparar · 105–120 min", "blocks": [{"type": "html", "html": "<div class='k'>Laboratório · 105–120 min</div><h2>7. Compare evidências, não apenas cronômetro</h2><div class='call amber'>Tempos mudam conforme CPU, RAM, Java, tamanho do dataset e cache do sistema. O objetivo é explicar a mudança no plano.</div>"}, {"type": "field", "id": "compare_plan", "label": "Compare baseline × otimizado: o que mudou na estratégia de join, UDF, PushedFilters e ReadSchema?", "big": true}, {"type": "field", "id": "compare_time", "label": "Compare os tempos. Houve ganho? Se não houve, quais fatores locais podem explicar?", "big": true}, {"type": "field", "id": "compare_ui", "label": "Na Spark UI, o que mudou em stages/exchanges/shuffle?", "big": true}, {"type": "check", "id": "compareok", "label": "Minha conclusão usa pelo menos duas evidências além do tempo."}]}, {"id": "cache", "title": "Cache · 120–140 min", "blocks": [{"type": "html", "html": "<div class='k'>Laboratório · 120–140 min</div><h2>8. Teste reutilização com cache</h2><p>Execute:</p>"}, {"type": "code", "code": "python cache_demo.py"}, {"type": "html", "html": "<p>O script roda três relatórios sem cache, depois faz <code>base.cache()</code>, materializa com <code>count()</code> e repete os relatórios. Ele grava <code>output/cache_metricas.json</code>.</p><div class='call'>Não compare somente “primeiro versus segundo”. Explique que <b>materializar o cache tem custo</b>; a vantagem aparece quando o mesmo DataFrame caro é reutilizado.</div>"}, {"type": "field", "id": "cache_level", "label": "Qual StorageLevel apareceu no terminal?", "big": false}, {"type": "field", "id": "cache_obs", "label": "O que aconteceu com os tempos dos relatórios após a materialização?", "big": true}, {"type": "field", "id": "cache_when", "label": "Quando você NÃO usaria cache neste pipeline?", "big": true}, {"type": "evidence", "id": "ev_cache", "label": "Evidência 5 · Cache / Spark UI / terminal", "help": "Print que mostre StorageLevel, tempos ou uso do cache."}, {"type": "check", "id": "cacheok", "label": "Executei o cache_demo e anexei uma evidência."}]}, {"id": "entrega", "title": "Entrega · 140–150 min", "blocks": [{"type": "html", "html": "<div class='k'>Laboratório · 140–150 min</div><h2>9. Feche o relatório e gere o PDF</h2><div class='g2'><div class='card green'><h3>PDF deve conter</h3><p>Nome/turma · respostas · 5 prints · tempos baseline/otimizado/cache · conclusão.</p></div><div class='card cyan'><h3>Backup antes de sair</h3><p>Baixe o JSON. Ele consegue restaurar respostas e prints comprimidos. Baixe também o Markdown se quiser cópia textual.</p></div></div>"}, {"type": "field", "id": "conclusao", "label": "Conclusão técnica (6–10 linhas): o que foi ruim no baseline, quais mudanças foram feitas e quais evidências sustentam que o plano ficou melhor?", "big": true}, {"type": "field", "id": "duvida", "label": "Qual conceito ainda ficou menos claro: Catalyst, explain, pushdown, broadcast ou cache? Explique a dúvida.", "big": true}, {"type": "check", "id": "evcheck", "label": "Conferi as 5 evidências no caderno."}, {"type": "check", "id": "jsoncheck", "label": "Baixei o JSON de backup."}, {"type": "check", "id": "pdfcheck", "label": "Usei Imprimir / Salvar PDF e conferi o arquivo antes de enviar."}]}, {"id": "erros", "title": "Deu errado?", "blocks": [{"type": "html", "html": "<div class='k'>Autonomia</div><h2>Antes de chamar o professor</h2><div class='g2'><div class='card red'><h3>python não reconhecido</h3><p>Tente <b>py</b> no Windows.</p></div><div class='card red'><h3>Java gateway</h3><p>Rode <code>java -version</code>. Use Java 17+ e confira JAVA_HOME/PATH.</p></div><div class='card amber'><h3>PySpark ausente</h3><p><code>python -m pip install -r requirements.txt</code></p></div><div class='card amber'><h3>data/ inexistente</h3><p>Execute <code>gerar_dados.py</code>.</p></div><div class='card cyan'><h3>4040 não abre</h3><p>Use exatamente a URL impressa pelo script; a porta pode ser 4041, 4042...</p></div><div class='card cyan'><h3>Script parece travado</h3><p>Veja se ele está aguardando ENTER para permitir o print da Spark UI.</p></div><div class='card amber'><h3>JSON muito grande</h3><p>Os prints são comprimidos automaticamente. Se ainda houver problema, remova uma evidência redundante e adicione novamente com uma captura menor.</p></div><div class='card amber'><h3>PDF sem todos os prints</h3><p>Espere as imagens aparecerem no caderno antes de clicar em Imprimir / Salvar PDF.</p></div></div>"}, {"type": "field", "id": "erro", "label": "Se houve erro, cole a mensagem principal e registre como resolveu.", "big": true}]}];
const e=window.React?React.createElement:null;const KEY='bigdataS10v1';const empty={answers:{},checks:{},done:{},evidence:{}};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||empty}catch{return empty}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(err){console.warn('localStorage cheio; use Baixar JSON',err);}}
function dl(name,text,type='text/plain'){const b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),600)}
function compressImage(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const maxW=1200,maxH=850,scale=Math.min(1,maxW/img.width,maxH/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.68));};img.src=r.result;};r.readAsDataURL(file)}
