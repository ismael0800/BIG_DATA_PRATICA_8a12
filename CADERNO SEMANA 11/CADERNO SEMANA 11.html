<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semana 11 · Caderno do Aluno · 60 min</title><style>
:root{--bg:#07101d;--bg2:#0b1424;--panel:#111e35;--text:#eef4ff;--muted:#aab9d1;--cyan:#55e7ff;--green:#62f0a6;--amber:#ffd166;--red:#ff7484;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--bg),#03060c);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:270px 1fr}.side{padding:14px 11px;border-right:1px solid var(--line);overflow:auto;background:#050a13ee}.brand,.tools{padding:12px;border:1px solid var(--line);border-radius:15px;margin-bottom:10px}.brand b{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:.15em}.brand h3{margin:7px 0}.brand small{color:var(--muted)}.nav button,.tools button,.tools label{display:block;width:100%;border:1px solid transparent;background:transparent;color:#b8c6db;text-align:left;padding:8px;border-radius:9px;margin:3px 0;cursor:pointer;font-weight:800}.nav button.on{background:#55e7ff14;color:white;border-color:#55e7ff40}.tools button,.tools label{border-color:var(--line);text-align:center;background:#ffffff07}.main{height:100vh;overflow:auto;padding:28px 34px 110px}.page{max-width:1050px;margin:auto;display:none}.page.on{display:block}.hero{min-height:72vh;display:flex;flex-direction:column;justify-content:center}.pill{display:inline-block;width:max-content;border:1px solid #55e7ff55;color:var(--cyan);background:#55e7ff0d;padding:6px 10px;border-radius:999px;font-weight:900}.kicker{color:var(--cyan);text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:900}h1{font-size:48px;margin:10px 0;line-height:1.05}h1 span{color:var(--cyan)}h2{font-size:31px;margin:8px 0 18px}.lead{font-size:19px;line-height:1.5;color:#d5e0f2}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.evidence,.call,.step{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#172743cc,#0b1428cc);padding:14px;margin:10px 0}.call{background:#55e7ff0d;border-color:#55e7ff40}.call.green{background:#62f0a60d;border-color:#62f0a650}.call.amber{background:#ffd1660d;border-color:#ffd16655}.call.red{background:#ff74840d;border-color:#ff748455}.timeline{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;border:1px solid var(--line);border-radius:14px;padding:14px}.timeline b{color:var(--cyan)}.step{display:grid;grid-template-columns:30px 1fr;gap:10px}.step>b{color:var(--cyan);font-size:20px}pre{white-space:pre-wrap;background:#02050b;border:1px solid #55e7ff35;border-radius:12px;padding:13px;font:12.5px/1.5 Consolas,monospace;color:#dffaff;overflow:auto}code{font-family:Consolas,monospace;color:#8defff}label{display:block;font-weight:900;margin:13px 0 6px}input[type=text],input:not([type]),textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#0004;color:white}textarea{min-height:88px;resize:vertical}.evidence{border-color:#62f0a650}.evidence b{color:var(--green)}.evidence p{color:#c2cee1}.evfile{margin:8px 0}.preview{display:none;max-width:100%;max-height:420px;border-radius:12px;border:1px solid var(--line);margin:8px 0}.check{padding:7px 0}.bottom{position:fixed;left:294px;right:24px;bottom:17px;display:flex;justify-content:space-between;pointer-events:none}.bottom button{pointer-events:auto;border:1px solid var(--line);background:#07101def;color:white;border-radius:10px;padding:10px 14px;font-weight:900}.counter{align-self:center;font-weight:900;color:#b8c6d8}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--cyan)}ul{line-height:1.6}.contrast{--bg:#000;--bg2:#000;--panel:#000;--text:#fff;--muted:#fff;--line:#fff}.contrast .card,.contrast .evidence,.contrast .call{background:#000}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:20px 16px 100px}.bottom{left:16px}.grid2{grid-template-columns:1fr}}@media print{body{background:white;color:black;overflow:visible}.side,.bottom,.evfile,.tools{display:none!important}.app{display:block;height:auto}.main{overflow:visible;height:auto;padding:0}.page{display:block!important;page-break-after:always;color:black}.hero{min-height:auto}.card,.evidence,.call,.step{background:white!important;border-color:#999;color:black}.preview{display:block!important;max-height:500px}textarea,input[type=text],input:not([type]){border:1px solid #999;color:black;background:white}.evidence textarea{display:none}pre{color:black;background:#f5f5f5;border-color:#999}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>Semana 11</b><h3>Caderno do Aluno</h3><small>ETL/ELT + dbt · 60 min</small></div><div id="nav" class="nav"></div><div class="tools"><button id="savejson">Baixar JSON</button><label>Carregar JSON<input id="loadjson" type="file" accept=".json" hidden></label><button id="savemd">Baixar Markdown</button><button onclick="window.print()">Imprimir / Salvar PDF</button><button id="contrast">Alto contraste</button></div></aside><main class="main"><div id="pages"></div></main></div><div class="bottom"><button id="prev">← Anterior</button><div id="counter" class="counter"></div><button id="next">Próximo →</button></div><script>
const pages=[["Comece aqui", "<div class=\"hero\"><div class=\"pill\">Semana 11 · prática reduzida</div><h1>ETL/ELT + dbt em <span>60 minutos</span></h1><p class=\"lead\">Você vai observar dados ruins falhando em testes, corrigir a camada staging, criar um mart e provar o resultado com evidências.</p><div class=\"grid2\"><div class=\"card\"><h3>Entrega</h3><p>PDF com respostas + prints. Faça também backup em JSON.</p></div><div class=\"card\"><h3>Regra</h3><p>Não basta mostrar código: registre <b>FAIL → correção → PASS → resultado final</b>.</p></div></div><div class=\"call amber\"><b>Não use dbt init.</b> O projeto já vem configurado para economizar tempo.</div></div><label>Nome</label><input data-key=\"nome\"><label>Turma</label><input data-key=\"turma\">"], ["Roteiro · 60 min", "<h2>Roteiro para caber em uma aula prática</h2><div class=\"timeline\"><b>0–10 min</b><span>instalar/validar ambiente + preparar DuckDB</span><b>10–20</b><span>rodar staging inicial e capturar a falha dos testes</span><b>20–35</b><span>corrigir TODO 1 e obter PASS</span><b>35–47</b><span>completar TODO 2 (mart)</span><b>47–55</b><span>dbt build + verificar resultado</span><b>55–60</b><span>evidências, conclusão, JSON e PDF</span></div><div class=\"call\">Se a instalação demorar, não pule etapas de qualidade: use o tempo restante e registre o ponto alcançado.</div>"], ["0–10 · Ambiente", "<h2>Abra o ZIP no VS Code e valide o ambiente</h2><div class=\"step\"><b>1</b><div>Extraia o ZIP e abra a pasta <code>aluno_projeto</code> no VS Code.</div></div><div class=\"step\"><b>2</b><div>Abra <b>Terminal → Novo Terminal</b>. Confirme que o terminal está na pasta que contém <code>dbt_project.yml</code>.</div></div><pre>python -m pip install -r requirements.txt\npython check_env.py\npython preparar_banco.py\ndbt debug --profiles-dir .</pre><div class=\"call green\">Você deve ver <b>AMBIENTE OK</b>, <b>BANCO PREPARADO</b> e, no dbt debug, a conexão concluída com sucesso.</div><div class=\"evidence\" data-eid=\"env\"><b>Evidência 1 · ambiente</b><p>Adicione um print do terminal com AMBIENTE OK / BANCO PREPARADO / conexão dbt.</p><input type=\"file\" accept=\"image/*\" class=\"evfile\"><img class=\"preview\"><textarea data-key=\"envleg\" placeholder=\"Legenda curta: o que esse print comprova?\"></textarea></div>"], ["10–20 · Faça o teste falhar", "<h2>Primeiro veja o problema antes de corrigir</h2><p>O <code>stg_orders.sql</code> inicial ainda deixa <code>status</code> despadronizado e duas linhas sem <code>order_id</code>. Rode:</p><pre>dbt run --select stg_orders stg_customers stg_products --profiles-dir .\ndbt test --select stg_orders --profiles-dir .</pre><div class=\"call red\"><b>Esperado:</b> pelo menos os testes de <code>not_null</code> e/ou <code>accepted_values</code> devem falhar. Isso é intencional.</div><label>Quais testes falharam? Copie os nomes principais.</label><textarea data-key=\"failtests\"></textarea><label>Por que o teste falhou?</label><textarea data-key=\"failwhy\"></textarea><div class=\"evidence\" data-eid=\"fail\"><b>Evidência 2 · FAIL inicial</b><p>Print do terminal mostrando os testes com falha.</p><input type=\"file\" accept=\"image/*\" class=\"evfile\"><img class=\"preview\"><textarea data-key=\"failleg\" placeholder=\"Legenda\"></textarea></div>"], ["20–35 · TODO 1 · staging", "<h2>Corrija o staging: padronizar antes de entregar ao restante do projeto</h2><p>Abra <code>models/staging/stg_orders.sql</code> e substitua o SELECT atual por:</p><pre>select\n    cast(order_id as integer) as order_id,\n    cast(customer_id as integer) as customer_id,\n    cast(product_id as integer) as product_id,\n    cast(total as decimal(12,2)) as total,\n    cast(order_date as date) as order_date,\n    lower(trim(status)) as status\nfrom {{ source('raw', 'orders') }}\nwhere order_id is not null</pre><p><b>O que cada mudança faz?</b></p><ul><li><code>cast</code>: garante tipos previsíveis.</li><li><code>trim</code>: remove espaços extras.</li><li><code>lower</code>: padroniza maiúsculas/minúsculas.</li><li><code>where order_id is not null</code>: remove registro sem chave.</li></ul><pre>dbt run --select stg_orders --profiles-dir .\ndbt test --select stg_orders --profiles-dir .</pre><div class=\"call green\"><b>Esperado agora: PASS.</b></div><label>Explique em 2–4 linhas por que staging não é só “copiar a tabela bruta”.</label><textarea data-key=\"stagingwhy\"></textarea><div class=\"evidence\" data-eid=\"pass\"><b>Evidência 3 · PASS após correção</b><p>Print do terminal com os testes passando.</p><input type=\"file\" accept=\"image/*\" class=\"evfile\"><img class=\"preview\"><textarea data-key=\"passleg\" placeholder=\"Legenda\"></textarea></div>"], ["35–47 · TODO 2 · mart", "<h2>Crie o modelo final de receita diária</h2><p>Abra <code>models/marts/fct_revenue_daily.sql</code> e substitua pelo código:</p><pre>select\n    order_date,\n    count(order_id) as total_pedidos,\n    round(sum(total), 2) as receita_total,\n    round(avg(total), 2) as ticket_medio\nfrom {{ ref('stg_orders') }}\nwhere status = 'paid'\ngroup by order_date</pre><div class=\"call\"><b>Observe o ref():</b> ele cria a dependência <code>stg_orders → fct_revenue_daily</code>. O dbt passa a conhecer a ordem correta do DAG.</div><label>Qual a diferença entre <code>source('raw','orders')</code> e <code>ref('stg_orders')</code>?</label><textarea data-key=\"sourceref\"></textarea><pre>dbt run --select fct_revenue_daily --profiles-dir .</pre>"], ["47–55 · Build completo", "<h2>Execute modelos + testes na ordem do DAG</h2><pre>dbt build --profiles-dir .\npython verificar_resultado.py</pre><div class=\"call green\"><b>Resultado esperado:</b> build concluído sem falhas e <code>MART OK</code> com os 5 dias de maior receita.</div><label>O que o <code>dbt build</code> fez além de executar os SELECTs?</label><textarea data-key=\"buildwhat\"></textarea><div class=\"evidence\" data-eid=\"build\"><b>Evidência 4 · dbt build</b><p>Print mostrando o resumo do build sem falhas.</p><input type=\"file\" accept=\"image/*\" class=\"evfile\"><img class=\"preview\"><textarea data-key=\"buildleg\" placeholder=\"Legenda\"></textarea></div><div class=\"evidence\" data-eid=\"mart\"><b>Evidência 5 · mart final</b><p>Print do <code>verificar_resultado.py</code> com MART OK e linhas de receita.</p><input type=\"file\" accept=\"image/*\" class=\"evfile\"><img class=\"preview\"><textarea data-key=\"martleg\" placeholder=\"Legenda\"></textarea></div>"], ["55–60 · Entrega", "<h2>Fechamento e entrega</h2><label>Em até 6 linhas: o que esta prática demonstrou sobre ELT + dbt?</label><textarea data-key=\"conclusao\"></textarea><div class=\"check\"><input type=\"checkbox\" data-key=\"ck1\"> Tenho print do ambiente.</div><div class=\"check\"><input type=\"checkbox\" data-key=\"ck2\"> Tenho print do FAIL inicial.</div><div class=\"check\"><input type=\"checkbox\" data-key=\"ck3\"> Tenho print do PASS após staging.</div><div class=\"check\"><input type=\"checkbox\" data-key=\"ck4\"> Tenho print do dbt build.</div><div class=\"check\"><input type=\"checkbox\" data-key=\"ck5\"> Tenho print do mart final.</div><div class=\"call amber\"><b>Antes de fechar:</b> clique em <b>Baixar JSON</b> para backup. Depois use <b>Imprimir / Salvar PDF</b>. Confira se os cinco prints aparecem no PDF antes de enviar.</div>"], ["Deu errado?", "<h2>Troubleshooting rápido</h2><table><tr><th>Problema</th><th>O que tentar</th></tr><tr><td><code>dbt</code> não reconhecido</td><td><code>python -m pip install -r requirements.txt</code> e feche/reabra o terminal.</td></tr><tr><td>Profile não encontrado</td><td>Use sempre <code>--profiles-dir .</code> e confirme que está na pasta do projeto.</td></tr><tr><td>raw.orders não existe</td><td>Rode <code>python preparar_banco.py</code>.</td></tr><tr><td>Teste ainda falha após TODO 1</td><td>Confirme <code>lower(trim(status))</code> e <code>where order_id is not null</code>.</td></tr><tr><td>Mart não tem receita_total</td><td>Você ainda está com o TODO 2 antigo; substitua todo o conteúdo do arquivo.</td></tr><tr><td>PDF sem print</td><td>Adicione a imagem no caderno e aguarde a prévia aparecer antes de imprimir.</td></tr></table><label>Se houve erro, registre a mensagem e como resolveu.</label><textarea data-key=\"erro\"></textarea>"]];let idx=0;const state={answers:{},checks:{},images:{}};const KEY='bigdata_s11_60min_v1';function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(state,x)}catch{}}function persist(){localStorage.setItem(KEY,JSON.stringify(state))}load();const root=document.getElementById('pages'),nav=document.getElementById('nav');pages.forEach((p,i)=>{const sec=document.createElement('section');sec.className='page';sec.innerHTML=`<div class="kicker">${i+1} / ${pages.length}</div>${p[1]}`;root.appendChild(sec);const b=document.createElement('button');b.textContent=`${i+1}. ${p[0]}`;b.onclick=()=>go(i);nav.appendChild(b)});function bind(){document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;if(el.type==='checkbox'){el.checked=!!state.checks[k];el.onchange=()=>{state.checks[k]=el.checked;persist()}}else{el.value=state.answers[k]||'';el.oninput=()=>{state.answers[k]=el.value;persist()}}});document.querySelectorAll('.evidence').forEach(box=>{const id=box.dataset.eid,img=box.querySelector('.preview'),input=box.querySelector('.evfile');if(state.images[id]){img.src=state.images[id];img.style.display='block'}input.onchange=()=>handleImage(input.files?.[0],id,img)})}function handleImage(file,id,img){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const maxW=1200,maxH=900,scale=Math.min(1,maxW/im.width,maxH/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);state.images[id]=c.toDataURL('image/jpeg',.72);img.src=state.images[id];img.style.display='block';try{persist()}catch{alert('O navegador ficou sem espaço. Use imagens menores ou faça backup em PDF/JSON agora.')}};im.src=r.result};r.readAsDataURL(file)}function go(n){idx=Math.max(0,Math.min(pages.length-1,n));document.querySelectorAll('.page').forEach((x,i)=>x.classList.toggle('on',i===idx));document.querySelectorAll('.nav button').forEach((x,i)=>x.classList.toggle('on',i===idx));document.getElementById('counter').textContent=`${idx+1} / ${pages.length}`;document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===pages.length-1;document.querySelector('.main').scrollTop=0}function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}document.getElementById('savejson').onclick=()=>dl('semana11_progresso.json',JSON.stringify(state,null,2),'application/json');document.getElementById('loadjson').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state.answers=x.answers||{};state.checks=x.checks||{};state.images=x.images||{};persist();location.reload()}catch{alert('JSON inválido')}};r.readAsText(f)};document.getElementById('savemd').onclick=()=>{let md='# Semana 11 — ETL/ELT + dbt\n\n';for(const [k,v] of Object.entries(state.answers))md+='## '+k+'\n'+(v||'(sem resposta)')+'\n\n';md+='## Evidências anexadas\n'+Object.keys(state.images).map(x=>'- '+x).join('\n')+'\n';dl('semana11_respostas.md',md,'text/markdown')};document.getElementById('contrast').onclick=()=>document.body.classList.toggle('contrast');document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('next').onclick=()=>go(idx+1);bind();go(0);
</script></body></html>
