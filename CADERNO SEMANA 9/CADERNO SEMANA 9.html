idth:1180px;margin:auto}.hero{min-height:67vh;display:flex;flex-direction:column;justify-content:center}.kicker{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan);font-weight:950}h2{font-size:41px;line-height:1.07;letter-spacing:-.035em;margin:9px 0 14px}h3{font-size:21px;margin:0 0 8px}.lead{font-size:18px;line-height:1.52;color:#dce6fb}.p{font-size:16px;line-height:1.5}.small{font-size:13px;line-height:1.45;color:var(--muted)}.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.card,.step,.field,.check{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(24,37,75,.82),rgba(9,15,36,.86));padding:16px}.card.cyan{border-color:rgba(85,231,255,.35)}.card.green{border-color:rgba(98,240,166,.32)}.card.amber{border-color:rgba(255,209,102,.34)}.card.red{border-color:rgba(255,116,132,.32)}.call{border:1px solid rgba(85,231,255,.28);background:rgba(85,231,255,.07);border-radius:15px;padding:12px 14px;margin:12px 0;line-height:1.45}.call.green{border-color:rgba(98,240,166,.3);background:rgba(98,240,166,.07)}.call.amber{border-color:rgba(255,209,102,.3);background:rgba(255,209,102,.07)}.call.red{border-color:rgba(255,116,132,.3);background:rgba(255,116,132,.07)}.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.node{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.06);font-weight:900}.arr{color:var(--cyan);font-size:22px}.step{display:grid;grid-template-columns:36px 1fr;gap:10px;margin:12px 0}.step .n{height:32px;width:32px;border-radius:50%;display:grid;place-items:center;background:rgba(85,231,255,.12);border:1px solid rgba(85,231,255,.3);font-weight:950;color:var(--cyan)}pre{white-space:pre-wrap;background:var(--code);border:1px solid rgba(85,231,255,.26);border-radius:14px;padding:14px 16px;font:12.3px/1.45 Consolas,monospace;overflow:auto}.cw{position:relative}.copy{position:absolute;right:8p if(!window.React||!window.ReactDOM){document.body.style.overflow="auto";document.getElementById("root").innerHTML="<div style=\"max-width:1100px;margin:30px auto;padding:20px;font-family:Segoe UI,Arial;color:#111;background:#fff\"><h1>Caderno do Aluno · PySpark Avançado · Semana 09</h1><p><b>Modo de contingência:</b> React não carregou. O conteúdo abaixo permanece acessível; salvamento automático e JSON exigem abrir novamente com internet.</p><hr><section><h2>01. Comece aqui</h2><div class=\"hero\"><div class=\"kicker\">Big Data · Semana 09 · laboratório</div><h2>PySpark Avançado · Caderno do Aluno</h2><div class=\"lead\">Depois de aproximadamente 50 minutos de teoria, este caderno conduz os 150 minutos de laboratório: preparar o ambiente, medir um pipeline lento, otimizar por etapas e sustentar a conclusão com evidências.</div><div class=\"grid g2\"><div class=\"card cyan\"><h3>Regra da prática</h3><div class=\"p\">Não aceite “ficou mais rápido” como explicação. Registre o que mudou no plano, no shuffle, nas tasks e no tempo.</div></div><div class=\"card green\"><h3>Projeto</h3><div class=\"p\">Abra o ZIP no VS Code. A partir da página <b>Prática · Preparar VS Code</b>, cada etapa informa arquivo → trecho → comando → resultado esperado.</div></div></div><div class=\"call amber\"><b>As próximas três páginas são consulta rápida.</b> Não precisam ser preenchidas em sequência; volte a elas se surgir dúvida durante o laboratório.</div><div class=\"call\"><b>Importante:</b> extraia o ZIP antes de abrir no VS Code.</div></div><p><b>Seu nome</b></p><p><b>Turma / grupo</b></p></section><hr><section><h2>02. Consulta · Narrow × Wide</h2><div class=\"kicker\">Referência rápida · sem atividade obrigatória</div><h2>Narrow × Wide</h2><div class=\"grid g2\"><div class=\"card green\"><h3>Narrow</h3><div class=\"p\">filter, select e withColumn normalmente trabalham dentro da própria partição.</div></div><div class=\"card red\"><h3>Wide</h3><div class=\"p\">groupBy, join, distinct e orderBy frequentemente exigem redistribuição entre partições.</div></div></div><div class=\"call\"><b>Shuffle</b> = dados cruzando fronteiras de partição/executor para que chaves relacionadas se encontrem.</div><div class=\"call amber\"><b>Use durante o laboratório:</b> quando vir muito Shuffle Read/Write, pergunte qual operação wide o provocou e se o volume poderia ter sido reduzido antes.</div></section><hr><section><h2>03. Consulta · Joins</h2><div class=\"kicker\">Referência rápida · sem atividade obrigatória</div><h2>Joins: resultado × estratégia física</h2><div class=\"call amber\">INNER e LEFT dizem quais linhas aparecem. BroadcastHashJoin, SortMergeJoin e outras estratégias dizem como o Spark executa.</div><pre>consulta.explain(\"formatted\")</pre><div class=\"grid g2\"><div class=\"card green\"><h3>Broadcast</h3><div class=\"p\">Copia a dimensão pequena para os executors e pode evitar um shuffle grande da tabela fato.</div></div><div class=\"card cyan\"><h3>No explain()</h3><div class=\"p\">Procure BroadcastHashJoin, BroadcastExchange, SortMergeJoin e Exchange.</div></div></div><div class=\"call red\"><b>Cuidado:</b> não force broadcast de uma tabela grande só porque ela tem menos linhas que a outra.</div></section><hr><section><h2>04. Consulta · Stages e partições</h2><div class=\"kicker\">Referência rápida · sem atividade obrigatória</div><h2>Job → Stage → Task</h2><div class=\"flow\"><span class=\"node\">Action</span><span class=\"arr\">→</span><span class=\"node\">Job</span><span class=\"arr\">→</span><span class=\"node\">Stages</span><span class=\"arr\">→</span><span class=\"node\">Tasks</span></div><div class=\"grid g2\"><div class=\"card red\"><h3>repartition</h3><div class=\"p\">Redistribui dados e pode aumentar ou diminuir partições.</div></div><div class=\"card green\"><h3>coalesce</h3><div class=\"p\">É usado principalmente para reduzir partições quando não é necessário reequilibrar tudo.</div></div></div><div class=\"call red\"><b>Data skew:</b> uma chave dominante pode criar uma task muito mais lenta. Na Spark UI, compare a duração das tasks do mesmo stage.</div></section><hr><section><h2>05. Prática · Preparar VS Code</h2><div class=\"kicker\">Laboratório · 0–10 min</div><h2>Abra o projeto e valide o ambiente</h2><div class=\"call amber\">Referência do pacote: <b>Python 3.10+</b>, <b>Java 17+</b> e <b>PySpark 4.2.0</b>.</div><h3>Passo 1 · Extraia e abra a pasta</h3><div class=\"p\">Extraia <b>aluno_projeto_pyspark_semana09.zip</b>. VS Code → Arquivo → Abrir Pasta → <b>aluno_projeto</b>.</div><h3>Passo 2 · Terminal integrado</h3><pre>python --version\njava -version</pre><div class=\"small\">No Windows, se necessário, tente <b>py --version</b>.</div><h3>Passo 3 · Instale/valide PySpark</h3><pre>python -m pip install -r requirements.txt\npython check_env.py</pre><div class=\"call green\">Resultado desejado: <b>AMBIENTE OK</b>. O script também imprime a URL real da Spark UI.</div><p>☐ check_env.py terminou com AMBIENTE OK.</p></section><hr><section><h2>06. Prática · Gerar 1,2M</h2><div class=\"kicker\">Laboratório · 10–25 min</div><h2>Crie o dataset local</h2><div class=\"call\">O ZIP permanece pequeno porque os dados são gerados no seu computador com Spark.</div><h3>Passo 1 · Execute o gerador</h3><pre>python gerar_dados.py</pre><div class=\"p\">Ele cria <b>1.200.000 pedidos</b>, 80 categorias e 27 estados em Parquet dentro de <b>data/</b>.</div><h3>Passo 2 · Plano B para máquina fraca</h3><pre>python gerar_dados.py --linhas 300000</pre><div class=\"small\">Use só se necessário. A proposta principal da aula continua sendo 1M+ linhas.</div><p><b>Quais três pastas apareceram dentro de data/?</b></p><p>☐ data/pedidos, data/categorias e data/estados foram criadas.</p></section><hr><section><h2>07. Prática · Baseline + Spark UI</h2><div class=\"kicker\">Laboratório · 25–55 min</div><h2>Execute antes de corrigir</h2><div class=\"call red\">Este script é lento de propósito: AQE e auto-broadcast estão desativados e os joins vêm antes do filtro. Não “corrija” ainda.</div><h3>Passo 1 · Execute</h3><pre>python pipeline_lento.py</pre><div class=\"p\">Quando o script pausar, abra a URL da Spark UI que apareceu no terminal. Depois pressione ENTER para disparar a action.</div><p><b>No explain: quais estratégias de join apareceram? Copie os nomes relevantes.</b></p><p><b>Na Spark UI: qual stage teve maior Shuffle Read/Write? Registre o valor aproximado.</b></p><p><b>Tempo do BASELINE na sua máquina (segundos).</b></p><p><b>Havia uma task muito mais lenta que as outras? O que você observou?</b></p><p>☐ Registrei plano, shuffle, tasks e tempo do baseline.</p></section><hr><section><h2>08. Prática · TODO 1 · Filtrar</h2><div class=\"kicker\">Laboratório · 55–75 min</div><h2>Filtrar antes</h2><div class=\"call\">Abra <b>pipeline_desafio.py</b> → função <b>filtrar_antes(df)</b>. Substitua apenas o <code>return None</code>.</div><pre>return (df\n    .filter(col(&quot;status&quot;) == &quot;paid&quot;)\n    .filter(col(&quot;total&quot;) &gt; 0)\n    .filter(col(&quot;order_date&quot;) &gt;= &quot;2024-07-01&quot;))</pre><h3>Passo 2 · Salve e rode</h3><pre>python pipeline_desafio.py</pre><div class=\"call green\">O script deve avançar e parar no <b>TODO 2</b>.</div><p><b>Por que essa mudança pode ajudar mesmo antes de falar em broadcast?</b></p><p>☐ O script chegou ao TODO 2.</p></section><hr><section><h2>09. Prática · TODO 2 · Broadcast</h2><div class=\"kicker\">Laboratório · 75–95 min</div><h2>Broadcast nas dimensões pequenas</h2><div class=\"call\">Na função <b>joins_otimizados</b>, substitua o <code>return None</code>:</div><pre>return (df_filtrado\n    .join(broadcast(dim_categorias), &quot;category_id&quot;, &quot;left&quot;)\n    .join(broadcast(dim_estados), &quot;state_id&quot;, &quot;left&quot;))</pre><h3>Passo 2 · Execute novamente</h3><pre>python pipeline_desafio.py</pre><div class=\"call green\">O script deve confirmar os joins e parar no <b>TODO 3</b>.</div><p><b>Qual lado do join está sendo copiado? Por que faz sentido?</b></p><p>☐ O script chegou ao TODO 3.</p></section><hr><section><h2>10. Prática · TODO 3 · Saída</h2><div class=\"kicker\">Laboratório · 95–120 min</div><h2>Agregue e prepare a saída</h2><pre>return (df_completo\n    .groupBy(&quot;category_name&quot;, &quot;state_name&quot;)\n    .agg(\n        round(sum(&quot;total&quot;), 2).alias(&quot;receita&quot;),\n        count(&quot;order_id&quot;).alias(&quot;pedidos&quot;),\n        round(avg(&quot;total&quot;), 2).alias(&quot;ticket_medio&quot;)\n    )\n    .orderBy(desc(&quot;receita&quot;))\n    .coalesce(4))</pre><h3>Passo 2 · Execute a versão completa</h3><pre>python pipeline_desafio.py</pre><div class=\"p\">Abra a UI durante a pausa. Procure <b>BroadcastHashJoin</b>/<b>BroadcastExchange</b> no explain e compare os shuffles com o baseline.</div><p><b>Quais estratégias de join aparecem agora?</b></p><p><b>Tempo da versão OTIMIZADA na sua máquina (segundos).</b></p><p><b>O que mudou no Shuffle Read/Write em relação ao baseline?</b></p><p>☐ A pasta output/otimizado foi criada e registrei as métricas.</p></section><hr><section><h2>11. Prática · Data skew</h2><div class=\"kicker\">Laboratório · 120–135 min</div><h2>Veja uma chave dominante deformar as partições</h2><div class=\"call amber\">O gerador colocou cerca de 35% dos pedidos em <b>customer_id=1</b> propositalmente.</div><pre>python skew_demo.py</pre><p><b>Quantos pedidos aparecem para o customer_id mais frequente?</b></p><p><b>Compare a maior e a menor partição. O que isso sugere sobre duração das tasks?</b></p><p>☐ Consegui relacionar distribuição desigual com possível task retardatária.</p></section><hr><section><h2>12. Entrega · Evidências</h2><div class=\"kicker\">Laboratório · 135–145 min</div><h2>Monte sua conclusão técnica</h2><div class=\"grid g2\"><div class=\"card green\"><h3>Entregue</h3><div class=\"p\">1. print do explain baseline.<br>2. print da Spark UI baseline.<br>3. print do explain otimizado.<br>4. print da Spark UI otimizada.<br>5. tempos A/B.<br>6. conclusão de até 8 linhas.</div></div><div class=\"card cyan\"><h3>Seu caderno</h3><div class=\"p\">Use <b>Baixar JSON</b> para preservar respostas. Em outro computador, use <b>Carregar JSON</b>.</div></div></div><p><b>Conclusão (até 8 linhas): quais mudanças tiveram efeito e quais evidências sustentam sua afirmação?</b></p><p><b>Qual parte do diagnóstico ainda ficou menos clara para você?</b></p><p>☐ Conferi as evidências e baixei o JSON do meu progresso.</p></section><hr><section><h2>13. Deu errado?</h2><div class=\"kicker\">Autonomia</div><h2>Antes de chamar o professor</h2><div class=\"grid g2\"><div class=\"card red\"><h3>python não reconhecido</h3><div class=\"p\">Tente <b>py</b> no Windows.</div></div><div class=\"card amber\"><h3>PySpark ausente</h3><div class=\"p\">Rode <b>python -m pip install -r requirements.txt</b>.</div></div><div class=\"card red\"><h3>Java gateway</h3><div class=\"p\">Confira <b>java -version</b>. Use Java 17+ e verifique JAVA_HOME.</div></div><div class=\"card amber\"><h3>data/pedidos não existe</h3><div class=\"p\">Execute <b>gerar_dados.py</b> antes dos pipelines.</div></div><div class=\"card cyan\"><h3>4040 não abre</h3><div class=\"p\">Use a URL impressa no terminal. A porta pode ser 4041/4042.</div></div><div class=\"card cyan\"><h3>Parece travado</h3><div class=\"p\">Veja se o script está esperando ENTER para você analisar a UI.</div></div></div><p><b>Se houve erro, cole a mensagem principal e registre como resolveu.</b></p></section><hr><section><h2>14. Fechamento · 5 min</h2><div class=\"hero\"><div class=\"kicker\">Laboratório · 145–150 min</div><h2>Fechamento: explique a mudança, não apenas o resultado.</h2><div class=\"flow\"><span class=\"node\">Baseline</span><span class=\"arr\">→</span><span class=\"node\">Evidência</span><span class=\"arr\">→</span><span class=\"node\">Mudança</span><span class=\"arr\">→</span><span class=\"node\">Nova evidência</span></div><div class=\"call green\">Se você consegue dizer <b>o que mudou no plano/shuffle/tasks e por que isso alterou o custo</b>, a meta da semana foi atingida.</div></div><p>☐ Consigo diagnosticar um pipeline usando explain + Spark UI antes de propor otimização.</p></section></div>";}
